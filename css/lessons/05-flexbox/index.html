<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 Flexbox</title>
    <style>
      .specs {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #a9a8a8;
        padding: 10px;
      }
      .spec {
        background: #afe0e1;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Flexbox</h1>
      <div class="specs">
        <div class="spec">321 mi range</div>
        <div class="spec">
          <div>5 seats</div>
          <div>Lorem ipsum dolor sit amet.</div>
        </div>
        <div class="spec">Electric</div>
      </div>
    </main>
  </body>
</html>
